<text x='30.0' y='30.0' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Uncertainty exponent: fraction of start points whose fate flips under a nudge ε</text>
<text x='30.0' y='48.0' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>f ∝ ε^α. Smooth boundary (integrable): α = 1 (dotted guide). Fractal boundary (chaotic): α ≪ 1. 300 crossings, tol 1e-11.</text>
<text x='30.0' y='64.0' font-size='11' fill='#52514e' text-anchor='start' font-weight='normal'>Compare SLOPES, not heights: f scales with 1/(window width), and V12's Kerr window (0.03) is wider than ours at L1 (0.0064).</text>
